{% extends "base.html" %}

{% block title %}{{ page_title }} — ExpenseTrack{% endblock %}

{% block head %}<link rel="stylesheet" href="{{ url_for('static', path='css/add-expense.css') }}">{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">{{ page_title }}</h1>
            <p class="auth-subtitle">{{ subtitle }}</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ form_action }}">
                <div class="expense-row">
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" name="amount"
                               class="form-input" step="0.01" min="0.01"
                               placeholder="0.00"
                               value="{{ values.amount }}" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date"
                               class="form-input"
                               value="{{ values.date }}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled{% if not values.category %} selected{% endif %}>Choose a category</option>
                        {% for category in categories %}
                        <option value="{{ category }}"{% if values.category == category %} selected{% endif %}>{{ category }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" maxlength="200"
                           placeholder="e.g. Lunch at cafe"
                           value="{{ values.description }}">
                </div>
                <div class="expense-actions">
                    <button type="submit" class="btn-submit">{{ submit_label }}</button>
                    <a href="{{ url_for('profile') }}" class="expense-cancel">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
