<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ExpenseTrack{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="{{ url_for('landing') }}" class="nav-brand">
                <span class="brand-icon">◈</span>
                <span class="brand-name">ExpenseTrack</span>
            </a>
            <button type="button" class="nav-toggle" id="nav-toggle"
                    aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
            </button>
            <div class="nav-links" id="nav-links">
                {% if current_user %}
                <a href="{{ url_for('analytics') }}" class="nav-analytics{% if request.url.path == url_for('analytics').path %} nav-active{% endif %}">Analytics</a>
                <a href="{{ url_for('profile') }}" class="nav-analytics{% if request.url.path == url_for('profile').path %} nav-active{% endif %}">Dashboard</a>
                <a href="{{ url_for('logout') }}" class="nav-cta">Sign out</a>
                {% else %}
                <a href="{{ url_for('login') }}">Sign in</a>
                <a href="{{ url_for('register') }}" class="nav-cta">Get started</a>
                {% endif %}
            </div>
        </div>
        <div class="nav-backdrop" id="nav-backdrop" hidden></div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span class="brand-icon">◈</span>
            <span class="footer-name">ExpenseTrack</span>
            <p class="footer-copy">Track every rupee. Own your finances.</p>
            <a href="{{ url_for('terms') }}">Terms and Conditions</a>
            <a href="{{ url_for('privacy') }}">Privacy Policy</a>
        </div>
    </footer>

    <script src="{{ url_for('static', path='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
